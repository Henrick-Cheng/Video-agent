name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install offline test dependencies
        run: pip install -r requirements-ci.txt

      # No API key, no GPU, no test videos in CI: backend-dependent tests
      # self-skip; the mock path must stay green (fail-loud contract).
      - name: Run offline test suite
        run: python -m pytest -m "not vllm" -q
