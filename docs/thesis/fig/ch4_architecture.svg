<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <marker id="arrBold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
  </defs>

  <!-- ===================== TOP BAND: AGENT LOOP ===================== -->
  <rect x="15" y="82" width="120" height="48" rx="24" fill="#ffffff" stroke="#222" stroke-width="1.4"/>
  <text x="75" y="102" text-anchor="middle" font-size="13" font-style="italic">question</text>
  <text x="75" y="118" text-anchor="middle" font-size="13" font-style="italic">q</text>

  <rect x="170" y="30" width="500" height="152" rx="8" fill="#f7f7f7" stroke="#222" stroke-width="1.6"/>
  <text x="420" y="52" text-anchor="middle" font-size="15" font-weight="bold">Agent &#8212; LLM tool-calling loop</text>

  <rect x="190" y="66" width="212" height="40" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <text x="296" y="83" text-anchor="middle" font-size="12">&#9312; Search(q) &#8212; mandatory first,</text>
  <text x="296" y="98" text-anchor="middle" font-size="12">free joint retrieval over M</text>

  <rect x="428" y="66" width="222" height="40" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <text x="539" y="83" text-anchor="middle" font-size="12">self-rate confidence &#947; &#8712; {1, 2, 3}</text>
  <text x="539" y="98" text-anchor="middle" font-size="12">answer if &#947; = 3, else explore</text>

  <path d="M 402 86 L 426 86" stroke="#222" stroke-width="1.2" marker-end="url(#arr)" fill="none"/>
  <path d="M 539 106 C 539 130 420 130 320 118 C 300 116 296 112 296 108" stroke="#222" stroke-width="1.1" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3"/>

  <text x="420" y="152" text-anchor="middle" font-size="11.5">budget: &#8804;2 explorations/round &#183; &#8804;3 rounds (instructed, prompt-level)</text>
  <text x="420" y="168" text-anchor="middle" font-size="11.5">hard cap: recursion limit &#923; = 5K+10 = 40 graph steps (enforced)</text>

  <rect x="828" y="82" width="136" height="48" rx="24" fill="#ffffff" stroke="#222" stroke-width="1.4"/>
  <text x="896" y="102" text-anchor="middle" font-size="13" font-style="italic">answer a</text>
  <text x="896" y="118" text-anchor="middle" font-size="12">+ evidence trace</text>

  <path d="M 135 106 L 168 106" stroke="#222" stroke-width="1.4" marker-end="url(#arr)" fill="none"/>
  <path d="M 670 106 L 826 106" stroke="#222" stroke-width="1.4" marker-end="url(#arr)" fill="none"/>

  <!-- ===================== MIDDLE BAND: MEMORY ===================== -->
  <rect x="100" y="252" width="680" height="196" rx="8" fill="#fbfbfb" stroke="#222" stroke-width="1.6"/>
  <text x="440" y="274" text-anchor="middle" font-size="15" font-weight="bold">Memory  M = &#9001;L&#8320;, L&#8321;, L&#8322;&#9002;  &#183;  VideoSession (persists across questions)</text>

  <rect x="118" y="290" width="200" height="138" fill="#efefef" stroke="#222" stroke-width="1.3"/>
  <text x="218" y="310" text-anchor="middle" font-size="13" font-weight="bold">L&#8320; &#183; global</text>
  <text x="218" y="325" text-anchor="middle" font-size="11" font-style="italic">built once at init</text>
  <text x="128" y="346" font-size="11.5">&#8226; 8-frame global summary</text>
  <text x="128" y="363" font-size="11.5">&#8226; full ASR transcript</text>
  <text x="128" y="380" font-size="11.5">&#8195;(timestamped lines)</text>
  <text x="128" y="397" font-size="11.5">&#8226; duration T</text>
  <text x="128" y="417" font-size="10.5" fill="#444">cost: 1 VLM call + local ASR</text>

  <rect x="344" y="290" width="200" height="138" fill="#efefef" stroke="#222" stroke-width="1.3"/>
  <text x="444" y="310" text-anchor="middle" font-size="13" font-weight="bold">L&#8321; &#183; evidence</text>
  <text x="444" y="325" text-anchor="middle" font-size="11" font-style="italic">grown on demand</text>
  <text x="354" y="346" font-size="11.5">&#8226; segments s&#7522; = (id, t&#115;, t&#101;,</text>
  <text x="354" y="363" font-size="11.5">&#8195;caption c&#7522;, frames)</text>
  <text x="354" y="380" font-size="11.5">&#8226; dense captions quote</text>
  <text x="354" y="397" font-size="11.5">&#8195;on-screen text verbatim</text>
  <text x="354" y="417" font-size="10.5" fill="#444">cost: 1 VLM call per segment</text>

  <rect x="570" y="290" width="192" height="138" fill="#efefef" stroke="#222" stroke-width="1.3"/>
  <text x="666" y="310" text-anchor="middle" font-size="13" font-weight="bold">L&#8322; &#183; index</text>
  <text x="666" y="325" text-anchor="middle" font-size="11" font-style="italic">written with L&#8321;</text>
  <text x="580" y="346" font-size="11.5">&#8226; entities (canonicalised)</text>
  <text x="580" y="363" font-size="11.5">&#8226; &#964; = &#9001;subj, rel, obj, t&#115;, t&#101;&#9002;</text>
  <text x="580" y="380" font-size="11.5">&#8226; provenance &#963;(&#964;) = seg:id</text>
  <text x="580" y="397" font-size="11.5">&#8226; closed 50-verb vocabulary</text>
  <text x="580" y="417" font-size="10.5" fill="#444">no extra call (joint output)</text>

  <!-- provenance pull-back: the argument of the figure -->
  <path d="M 570 350 L 546 350" stroke="#000" stroke-width="3" marker-end="url(#arrBold)" fill="none"/>
  <text x="558" y="338" text-anchor="middle" font-size="10.5" font-weight="bold">pull-back</text>
  <text x="440" y="443" text-anchor="middle" font-size="11" font-weight="bold">provenance pull-back: a matched triplet forces its parent caption c&#7522; into the result at score 1.0 &#8212; &#8220;the graph is a catalogue, the evidence is the caption&#8221;</text>

  <!-- Agent <-> Memory arrows -->
  <path d="M 296 106 L 296 288" stroke="#222" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)" fill="none"/>
  <path d="M 320 288 L 320 108" stroke="#222" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#arr)" fill="none"/>
  <text x="240" y="212" font-size="11.5" text-anchor="middle">&#9312; Search &#8212; free</text>
  <text x="240" y="227" font-size="11.5" text-anchor="middle">(read L&#8320;+L&#8321;+L&#8322;)</text>

  <path d="M 150 290 C 130 220 140 170 168 150" stroke="#222" stroke-width="1.1" stroke-dasharray="2 3" marker-end="url(#arr)" fill="none"/>
  <text x="88" y="212" font-size="11" text-anchor="middle">L&#8320; context</text>
  <text x="88" y="226" font-size="11" text-anchor="middle">prefix, every turn</text>

  <!-- ===================== BOTTOM BAND: PERCEPTION ===================== -->
  <rect x="100" y="530" width="680" height="150" rx="8" fill="#fbfbfb" stroke="#222" stroke-width="1.6"/>
  <text x="440" y="552" text-anchor="middle" font-size="15" font-weight="bold">Perception</text>

  <rect x="118" y="566" width="300" height="94" fill="#ffffff" stroke="#222" stroke-width="1.3"/>
  <text x="268" y="584" text-anchor="middle" font-size="12.5" font-weight="bold">video V &#183; timeline 0 &#8594; T</text>
  <line x1="134" y1="600" x2="402" y2="600" stroke="#222" stroke-width="1.4"/>
  <line x1="134" y1="596" x2="134" y2="604" stroke="#222" stroke-width="1.4"/>
  <line x1="402" y1="596" x2="402" y2="604" stroke="#222" stroke-width="1.4"/>
  <g stroke="#666" stroke-width="1">
    <line x1="150" y1="594" x2="150" y2="606"/><line x1="183" y1="594" x2="183" y2="606"/>
    <line x1="216" y1="594" x2="216" y2="606"/><line x1="249" y1="594" x2="249" y2="606"/>
    <line x1="282" y1="594" x2="282" y2="606"/><line x1="315" y1="594" x2="315" y2="606"/>
    <line x1="348" y1="594" x2="348" y2="606"/><line x1="381" y1="594" x2="381" y2="606"/>
  </g>
  <text x="268" y="622" text-anchor="middle" font-size="10.5" fill="#444">| : 8 uniform frames &#8594; L&#8320; summary (init, once)</text>
  <rect x="300" y="628" width="72" height="14" fill="#dddddd" stroke="#222" stroke-width="1"/>
  <text x="268" y="640" text-anchor="end" font-size="10.5" fill="#444">agent-chosen window [t&#115;, t&#101;], &#8804;6 frames &#8594;</text>

  <rect x="470" y="576" width="128" height="60" fill="#ffffff" stroke="#222" stroke-width="1.3"/>
  <text x="534" y="601" text-anchor="middle" font-size="12.5" font-weight="bold">VLM</text>
  <text x="534" y="618" text-anchor="middle" font-size="11">qwen-vl-plus</text>

  <rect x="628" y="576" width="134" height="60" fill="#ffffff" stroke="#222" stroke-width="1.3"/>
  <text x="695" y="597" text-anchor="middle" font-size="12.5" font-weight="bold">local ASR</text>
  <text x="695" y="614" text-anchor="middle" font-size="11">faster-whisper</text>
  <text x="695" y="629" text-anchor="middle" font-size="10.5" fill="#444">no API cost</text>

  <path d="M 418 606 L 468 606" stroke="#222" stroke-width="1.2" marker-end="url(#arr)" fill="none"/>

  <!-- Explore / Inspect arrows: routed to the RIGHT of the memory band -->
  <path d="M 640 182 C 815 250 835 470 566 576" stroke="#222" stroke-width="1.4" marker-end="url(#arr)" fill="none"/>
  <text x="800" y="308" font-size="11.5" text-anchor="start">&#9313; Explore(t&#115;, t&#101;, focus)</text>
  <text x="800" y="323" font-size="11.5" text-anchor="start">1 VLM call, &#8804;6 frames</text>
  <path d="M 662 182 C 850 260 875 480 592 574" stroke="#222" stroke-width="1.1" marker-end="url(#arr)" fill="none"/>
  <text x="800" y="355" font-size="11.5" text-anchor="start">&#9314; Inspect(t, q&#8242;)</text>
  <text x="800" y="370" font-size="11.5" text-anchor="start">1 VLM call, 1 frame</text>

  <!-- Perception writes into memory -->
  <path d="M 500 574 C 480 520 460 470 450 430" stroke="#222" stroke-width="1.4" marker-end="url(#arr)" fill="none"/>
  <text x="418" y="508" font-size="11.5" text-anchor="end">caption + triplets</text>
  <text x="418" y="523" font-size="11.5" text-anchor="end">(one joint call) &#8594; L&#8321;+L&#8322;</text>
  <path d="M 598 574 C 640 520 660 470 666 430" stroke="#222" stroke-width="1.1" stroke-dasharray="6 3" marker-end="url(#arr)" fill="none"/>
  <text x="700" y="500" font-size="11" text-anchor="start">Inspect write-back &#8594; L&#8322;</text>
  <text x="700" y="515" font-size="11" text-anchor="start">(&#963; = inspector, conf 0.75)</text>
  <path d="M 695 576 C 695 540 500 470 250 432" stroke="#222" stroke-width="1.1" stroke-dasharray="2 3" marker-end="url(#arr)" fill="none"/>
  <text x="760" y="548" font-size="11" text-anchor="start">transcript &#8594; L&#8320;</text>
  <text x="760" y="563" font-size="11" text-anchor="start">(init, once)</text>
</svg>
